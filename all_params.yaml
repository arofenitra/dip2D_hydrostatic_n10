# =============================================================================
#  params.yaml -- SINGLE SOURCE OF TRUTH for every case of this project.
#  tools/gen_case.py reads ONLY this file and derives everything else
#  (mesh, fields, BC values, solver settings).  Never edit duplicate values
#  inside a generated case by hand: edit here and re-generate.
#  All quantities are SI (m, s, kg, Pa, K, N/m).
# =============================================================================

meta:
  project: "Terrain-induced slugging: 1D drift-flux vs 2D planar VOF vs 3D VOF"
  openfoam_version: "14"          # OpenFOAM Foundation (openfoam.org), /opt/openfoam14
  openfoam_solver: "compressibleVoF"   # run via `foamRun`
  author: "A. Rarivonjy (project), automated case generator"
  date: "2026-11-19"

# -----------------------------------------------------------------------------
# Geometry: two straight legs forming a V-dip in the x-y plane (gravity -y).
#   Leg 1: from the inlet (x=0, high point) down to the dip vertex (x=leg, y=0)
#   Leg 2: from the dip vertex up to the outlet (x=2*leg, high point)
#   2D is PLANAR: one cell thick in z, front/back patches are `empty`.
#   Vertical height H = D/cos(theta) so that the perpendicular gap equals D.
# -----------------------------------------------------------------------------
geometry:
  D: 0.050                 # pipe internal diameter / perpendicular gap [m]
  leg_length: 3.0          # axial length of each leg [m]
  angle_deg: 5.0           # |slope| of each leg [deg]
  thickness_2d: 0.010      # z-thickness of the planar 2D mesh [m] (arbitrary, empty BC)

# -----------------------------------------------------------------------------
# Case A fluids (laminar oil-air)
# -----------------------------------------------------------------------------
fluids:
  liquid_name: oil
  gas_name: air
  rho_l: 900.0             # [kg/m3] constant-density liquid
  mu_l: 0.2                # [Pa s]
  Cp_l: 2000.0             # [J/kg/K]
  Pr_l: 100.0              # [-] (oil; only weakly relevant in laminar flow)
  molWeight_l: 900.0       # [g/mol] placeholder required by `specie` (unused for rhoConst)
  mu_g: 1.8e-5             # [Pa s]
  Cp_g: 1007.0             # [J/kg/K]
  Pr_g: 0.7                # [-]
  molWeight_g: 28.9        # [g/mol] -> R_g = 8314.46/28.9 = 287.7 J/kg/K
  sigma: 0.03              # [N/m] surface tension (constant)

# -----------------------------------------------------------------------------
# Operating point and boundary conditions
# -----------------------------------------------------------------------------
operating:
  J_L: 0.2                 # liquid superficial velocity [m/s]
  J_G: 0.5                 # gas superficial velocity [m/s]
  h_over_D_inlet: 0.3      # inlet stratified liquid layer fraction (of D)
  p0: 1.0e+5                # outlet pressure [Pa]
  T0: 293.0                # inlet temperature [K]
  # The 2D planar inlet layer is split at the nearest integer number of cells.
  # The generated value f = split_cells/n is written to meta.json and used
  # consistently: U_l = J_L/f, U_g = J_G/(1-f), so the FLOW RATES are exact.

initial:
  pool_level: 0.15         # initial horizontal liquid free surface height [m]
                           # above the dip vertex (y=0); liquid below, gas above
  p_rgh0: 1.0e+5            # initial uniform p_rgh [Pa] (near-hydrostatic for gas)

solver:
  endTime: 120.0           # [s]
  writeInterval: 1.0       # field write interval [s]
  deltaT: 0.001            # initial time step [s]
  maxCo: 0.5
  maxAlphaCo: 0.5
  maxDeltaT: 0.01
  nOuterCorrectors: 3
  nCorrectors: 1
  nNonOrthogonalCorrectors: 0
  nAlphaSubCycles: 3
  writeFormat: binary
  thermo: adiabatic        # "adiabatic" (energy eq on, adiabatic walls) or
                           # "isothermal" (fixedTemperature constraint T=T0)

# -----------------------------------------------------------------------------
# Function objects sampling frequency [s]
# -----------------------------------------------------------------------------
sampling:
  interval: 0.05           # pressure / holdup / mass-flow time series [s]
  interface_locations: 61  # number of vertical interface-height columns along x

# -----------------------------------------------------------------------------
# NAMED CASES.  Each key is used by:  python3 tools/gen_case.py <key>
#   kind: dip | straight
# -----------------------------------------------------------------------------
cases:

  # ---- Stage S1: straight planar channel, two-layer laminar verification ----
  straight2D_n10:
    kind: straight
    n_per_D: 10
    endTime: 15.0
    writeInterval: 0.5
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    initial_pool_level: 0.015      # horizontal channel: liquid layer 0.015 m
    n_interface: 31

  # ---- Stage S2: dip, no flow (hydrostatics / spurious currents) ------------
  dip2D_hydrostatic_n10:
    kind: dip
    n_per_D: 10
    endTime: 5.0
    writeInterval: 0.25
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    no_flow: true                  # zero inlet velocity, closed outlet -> static
    initial_pool_level: 0.15
    n_interface: 31

  # ---- Next tasks: rule-5 J_L/J_G variants (rank 3 of the rule-5 list) ------
  dip2D_screen_hiJL_n10:
    kind: dip
    n_per_D: 10
    J_L: 0.4
    endTime: 30.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  dip2D_screen_hiJG_n10:
    kind: dip
    n_per_D: 10
    J_G: 1.0
    endTime: 30.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- Next tasks: time-step sensitivity (half the Courant limit) -----------
  dip2D_screen_n10_dt2:
    kind: dip
    n_per_D: 10
    maxCo: 0.25
    maxAlphaCo: 0.25
    endTime: 8.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- Next tasks: 3D dip as a rectangular duct (genuine 3D VOF) ------------
  dip3D_duct_n6:
    kind: dip
    three_d: true
    n_per_D: 6
    n_z: 6
    endTime: 6.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 31
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- S3b: rule-5 variation if no cycle at 5 deg (steeper dip) -------------
  dip2D_screen_ang10_n10:
    kind: dip
    n_per_D: 10
    angle_deg: 10.0
    endTime: 30.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- V5 follow-up: finer hydrostatic mesh (spurious-current scaling) ------
  dip2D_hydrostatic_n30:
    kind: dip
    n_per_D: 30
    endTime: 10.0
    writeInterval: 1.0
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    no_flow: true
    initial_pool_level: 0.15
    n_interface: 31

  # ---- V8 follow-up: straight channel with a resolved gas film --------------
  straight2D_n30:
    kind: straight
    n_per_D: 30
    endTime: 40.0
    writeInterval: 1.0
    initial_pool_level: 0.015
    n_interface: 31
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- S2 controls: capillary-artifact diagnosis ----------------------------
  dip2D_hydrostatic_nosigma_n10:
    kind: dip
    n_per_D: 10
    endTime: 5.0
    writeInterval: 0.25
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    no_flow: true
    initial_pool_level: 0.15
    n_interface: 31
    sigma: 0.0

  dip2D_hydrostatic_n20:
    kind: dip
    n_per_D: 20
    endTime: 5.0
    writeInterval: 0.5
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    no_flow: true
    initial_pool_level: 0.15
    n_interface: 31

  # ---- Stage S3: coarse 2D dip screening ------------------------------------
  dip2D_screen_n10:
    kind: dip
    n_per_D: 10
    endTime: 60.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- Stage S4: production 2D resolution set ------------------------------- 
  dip2D_n15:
    kind: dip
    n_per_D: 15
    endTime: 40.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  dip2D_n20:
    kind: dip
    n_per_D: 20
    endTime: 25.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  dip2D_n30:
    kind: dip
    n_per_D: 30
    endTime: 15.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2

  # ---- control run: incompressible VoF (same mesh / BCs) --------------------
  dip2D_incompressible_n10:
    kind: dip
    n_per_D: 10
    endTime: 60.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    solver: incompressibleVoF      # same equations with div(U)=0, no T

  # ---- thermo sensitivity: isothermal gas -----------------------------------
  dip2D_isothermal_n10:
    kind: dip
    n_per_D: 10
    endTime: 60.0
    writeInterval: 1.0
    initial_pool_level: 0.15
    n_interface: 61
    nOuterCorrectors: 2
    nAlphaSubCycles: 2
    thermo: isothermal
